[package]
name = "emasan1999/coffee-dat"
version = "0.1.1"
description = "Tienda Virtual de Productos para Caficultura"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app/" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
