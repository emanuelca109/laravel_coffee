
kind: wasmer.io/App.v0
name: coffeedat
owner: emasan1999
package: .
debug: false

cli_args:
  - "-t"
  - "/app/public"
  - "-S"
  - "localhost:8080"

env:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_NAME: "Coffee.Dat"
  APP_LOCALE: es
  DB_CONNECTION: mysql
  SESSION_DRIVER: cookie
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  LOG_CHANNEL: stderr
  VIEW_COMPILED_PATH: /tmp/coffee-dat-views

scaling:
  mode: single_concurrency

locality:
  regions:
    - fr-roub1

capabilities:
  database:
    engine: mysql
  cdn_cache:
    enabled: true
app_id: da_R8EIJtNUPwzp
