<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <!-- Gradient for green leaves -->
    <linearGradient id="leafGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    
    <!-- Gradient for coffee bean -->
    <linearGradient id="beanGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <!-- Centered Icon Mark -->
  <g transform="translate(5, 0)">
    <!-- Outer gold/bronze thin circle accent -->
    <circle cx="35" cy="40" r="34" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
    
    <!-- Sprout Leaves -->
    <!-- Left Leaf -->
    <path d="M35,30 C20,30 14,18 20,8 C30,8 35,18 35,30 Z" fill="url(#leafGradIcon)" />
    <!-- Right Leaf -->
    <path d="M35,30 C50,30 56,18 50,8 C40,8 35,18 35,30 Z" fill="url(#leafGradIcon)" />
    <!-- Leaf veins -->
    <path d="M35,30 C30,22 28,16 26,12" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" />
    <path d="M35,30 C40,22 42,16 44,12" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" />

    <!-- Coffee Bean Body -->
    <!-- Left side -->
    <path d="M32,32 C16,32 10,50 10,62 C10,74 22,78 30,78 C32,66 30,50 32,32 Z" fill="url(#beanGradIcon)" />
    <!-- Right side -->
    <path d="M38,32 C54,32 60,50 60,62 C60,74 48,78 40,78 C38,66 40,50 38,32 Z" fill="url(#beanGradIcon)" />
    
    <!-- S-curve gap/line in the middle of the bean -->
    <path d="M33,34 C33,46 37,54 35,66 C33,74 38,77 38,77" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
